<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commande — VITAL Laboratoires</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/shop.css">
<link rel="stylesheet" href="assets/buttons.css">
</head>
<body data-no-drawer>
<div id="site-top"></div>

<main class="s-page">
  <div class="s-steps" id="steps"></div>
  <h1 class="s-title">Finaliser ma commande</h1>
  <p class="s-lead">Renseignez vos informations, choisissez votre mode de livraison puis votre moyen de paiement.</p>
  <div id="root"></div>
</main>

<div id="site-footer"></div>

<script src="assets/catalogue.js"></script>
<script src="assets/shop.js"></script>
<script>
(function () {
  var V = window.VITAL, esc = V.escapeHtml, money = V.fmtMoney, CFG = V.CONFIG;
  V.mountChrome({ minimal: true });
  var root = document.getElementById('root');
  var state = { step: 1, delivery: null, payment: 'card', savedAddr: null, createAccount: false };

  /* ---------- helpers de formulaire ---------- */
  function field(id, label, o) {
    o = o || {};
    return '<div class="s-field' + (o.full ? ' full' : '') + '" data-f="' + id + '"><label for="' + id + '">' + label + (o.opt ? ' <span class="opt">(facultatif)</span>' : '') + '</label>' +
      (o.select ? '<select class="s-input" id="' + id + '"><option value="">Sélectionner…</option>' + o.select.map(function (g) { return '<option>' + esc(g) + '</option>'; }).join('') + '</select>'
                : '<input class="s-input" id="' + id + '" type="' + (o.type || 'text') + '" ' + (o.ph ? 'placeholder="' + esc(o.ph) + '" ' : '') + (o.auto ? 'autocomplete="' + o.auto + '" ' : '') + (o.inputmode ? 'inputmode="' + o.inputmode + '" ' : '') + (o.max ? 'maxlength="' + o.max + '" ' : '') + '>') +
      '<span class="err">' + esc(o.err || 'Champ obligatoire') + '</span></div>';
  }
  function $(id) { return document.getElementById(id); }
  function val(id) { var e = $(id); return e ? e.value.trim() : ''; }
  function setInvalid(id, bad) { var w = document.querySelector('[data-f="' + id + '"]'); if (w) w.classList.toggle('invalid', !!bad); return !bad; }
  function steps() {
    var names = ['Panier', 'Informations', 'Livraison', 'Paiement'];
    var html = '';
    names.forEach(function (n, i) {
      var cls = i === 0 ? 'done' : (i === state.step ? 'on' : (i < state.step ? 'done' : ''));
      html += (i ? '<span class="bar"></span>' : '') + '<span class="st ' + cls + '"><i>' + (cls === 'done' ? V.ICON.check : i + 1) + '</i>' + n + '</span>';
    });
    $('steps').innerHTML = html;
  }

  /* ---------- squelette ---------- */
  function build() {
    var lines = V.cartLines();
    if (!lines.length) {
      root.innerHTML = '<div class="s-card"><div class="s-empty">' + V.ICON.bag + '<h3>Votre panier est vide</h3><p>Ajoutez des produits à votre panier avant de passer commande.</p><a href="index.html#produits" class="btn-primary">Voir les produits</a></div></div>';
      $('steps').innerHTML = ''; return false;
    }
    if (V.computeTotals(lines, null).unpriced) {
      root.innerHTML = '<div class="s-card"><div class="s-empty">' + V.ICON.bag + '<h3>Un article n’a pas encore de prix</h3><p>Retirez-le de votre panier pour pouvoir passer commande.</p><a href="panier.html" class="btn-primary">Retour au panier</a></div></div>';
      $('steps').innerHTML = ''; return false;
    }
    var user = V.currentUser();
    var opts = Object.keys(CFG.shipping).map(function (k) {
      var s = CFG.shipping[k];
      return '<label class="s-opt" data-ship="' + k + '"><input type="radio" name="ship" value="' + k + '"><div class="body"><div class="t">' + esc(s.label) + '</div><div class="d">' + esc(s.eta) + '</div></div><span class="p" data-shipprice="' + k + '"></span></label>';
    }).join('');
    root.innerHTML =
      '<form id="checkout" class="s-layout" novalidate><div>' +

      /* 1. Informations */
      '<section class="s-card pad s-sec" id="sec1"><div class="s-sec-head"><span class="n">1</span><h2>Vos informations</h2></div>' +
        (user ? '<div class="s-alert info show" style="margin-bottom:16px">Connecté en tant que <b>' + esc(user.firstName + ' ' + user.lastName) + '</b> (' + esc(user.email) + ') · <button type="button" class="link-plain" id="lo">Ce n’est pas vous ?</button></div>'
              : '<div class="s-muted" style="margin:-6px 0 16px">Déjà client ? <a class="link-plain" href="compte.html?next=commande.html#connexion">Connectez-vous</a> pour retrouver vos adresses.</div>') +
        '<div id="saved"></div>' +
        '<div class="s-form-grid" id="addr-form">' +
          field('firstName', 'Prénom', { auto: 'given-name' }) + field('lastName', 'Nom', { auto: 'family-name' }) +
          field('email', 'Adresse e-mail', { type: 'email', auto: 'email', err: 'Saisissez une adresse e-mail valide', full: true }) +
          field('phone', 'Téléphone', { type: 'tel', auto: 'tel', ph: '06 12 34 56 78', inputmode: 'tel', err: 'Numéro français à 10 chiffres (ex. 06 12 34 56 78)', full: true }) +
          field('address', 'Adresse', { auto: 'address-line1', ph: 'N°, rue, résidence…', full: true }) +
          field('complement', 'Complément d’adresse', { opt: true, full: true, auto: 'address-line2' }) +
          field('zip', 'Code postal', { inputmode: 'numeric', max: 5, err: 'Code postal à 5 chiffres', auto: 'postal-code' }) +
          field('city', 'Ville', { auto: 'address-level2' }) +
        '</div>' +
        (user ? '<label class="s-check" style="margin-top:16px"><input type="checkbox" id="saveAddr"> Enregistrer cette adresse dans mon compte</label>'
              : '<label class="s-check" style="margin-top:16px"><input type="checkbox" id="mkAccount"> Créer un compte pour suivre mes commandes et commander plus vite</label>' +
                '<div class="s-form-grid" id="acc-fields" style="display:none;margin-top:14px">' + field('pw', 'Mot de passe', { type: 'password', auto: 'new-password', err: '8 caractères minimum' }) + field('pw2', 'Confirmer le mot de passe', { type: 'password', auto: 'new-password', err: 'Les mots de passe ne correspondent pas' }) + '</div>' +
                '<div class="s-alert err" id="acc-err" style="margin-top:12px"></div>') +
        '<div style="margin-top:22px"><button type="button" class="btn-primary" id="next1">Continuer vers la livraison</button></div>' +
      '</section>' +

      /* 2. Livraison */
      '<section class="s-card pad s-sec locked" id="sec2"><div class="s-sec-head"><span class="n">2</span><h2>Mode de livraison</h2></div>' +
        '<div class="s-opts">' + opts + '</div>' +
        '<div class="s-alert err" id="ship-err" style="margin-top:12px">Choisissez un mode de livraison.</div>' +
        '<div class="s-field" style="margin-top:16px"><label for="note">Instructions pour la livraison <span class="opt">(facultatif)</span></label><textarea class="s-input" id="note" placeholder="Digicode, étage, horaires de disponibilité…"></textarea></div>' +
        '<div style="margin-top:22px"><button type="button" class="btn-primary" id="next2">Continuer vers le paiement</button></div>' +
      '</section>' +

      /* 3. Paiement */
      '<section class="s-card pad s-sec locked" id="sec3"><div class="s-sec-head"><span class="n">3</span><h2>Paiement</h2></div>' +
        '<div class="s-demo" style="margin-bottom:16px">Mode démonstration : aucun paiement réel n’est effectué et aucune donnée de carte n’est enregistrée.</div>' +
        '<div class="s-opts" id="pay-opts">' +
          '<div class="s-opt sel" data-pay="card"><input type="radio" name="pay" value="card" checked><div class="body"><div class="t">Carte bancaire</div><div class="d">Paiement immédiat et sécurisé</div><div class="s-badges"><span>CB</span><span>VISA</span><span>MASTERCARD</span></div>' +
            '<div class="extra"><div class="s-form-grid">' +
              field('cardName', 'Titulaire de la carte', { full: true, auto: 'cc-name' }) +
              field('cardNum', 'Numéro de carte', { full: true, inputmode: 'numeric', ph: '1234 5678 9012 3456', auto: 'cc-number', max: 23, err: 'Numéro de carte invalide' }) +
              field('cardExp', 'Expiration', { ph: 'MM/AA', inputmode: 'numeric', max: 5, auto: 'cc-exp', err: 'Date invalide ou expirée' }) +
              field('cardCvc', 'Cryptogramme', { ph: '123', inputmode: 'numeric', max: 4, auto: 'cc-csc', err: '3 ou 4 chiffres' }) +
            '</div><div class="s-muted" style="margin-top:10px">Carte de test : 4242 4242 4242 4242 · date future · CVC 123. Le numéro 4000 0000 0000 0002 simule un refus.</div></div>' +
          '</div></div>' +
          '<label class="s-opt" data-pay="wallet"><input type="radio" name="pay" value="wallet"><div class="body"><div class="t">PayPal</div><div class="d">Vous serez redirigé vers PayPal pour valider le paiement.</div></div></label>' +
          '<label class="s-opt" data-pay="cod"><input type="radio" name="pay" value="cod"><div class="body"><div class="t" id="cod-t">Paiement à la livraison</div><div class="d" id="cod-d">Réglez en espèces à la réception de votre colis.</div></div></label>' +
        '</div>' +
        '<label class="s-check" style="margin-top:20px" id="cgv-w"><input type="checkbox" id="cgv"> <span>J’ai lu et j’accepte les <a href="#" onclick="return false;">conditions générales de vente</a> et la <a href="#" onclick="return false;">politique de confidentialité</a>.</span></label>' +
        '<div class="s-alert err" id="pay-err" style="margin-top:14px"></div>' +
        '<div style="margin-top:22px"><button type="submit" class="btn-purple btn-block" id="submit" style="padding:16px 28px;font-size:15px">Payer</button></div>' +
      '</section>' +

      '</div>' +

      /* Récapitulatif */
      '<aside class="s-sticky"><div class="s-card pad s-sum" id="summary"></div></aside></form>';
    return true;
  }

  /* ---------- récapitulatif ---------- */
  function renderSummary() {
    var lines = V.cartLines(), t = V.computeTotals(lines, state.delivery);
    var shipTxt = state.delivery === null ? 'À choisir' : (t.shipping === 0 ? 'Offerte' : money(t.shipping));
    $('summary').innerHTML =
      '<h2>Votre commande</h2>' +
      lines.map(function (l) {
        var p = l.product;
        return '<div class="s-line compact"><div class="img"><img src="' + p.image + '" alt=""><b>' + l.qty + '</b></div><div><div class="nm">' + esc(p.name) + '</div><div class="sb">' + esc(p.size) + '</div></div><div class="tot">' + money(l.total) + '</div></div>';
      }).join('') +
      '<div class="s-promo"><input class="s-input" id="promo" placeholder="Code promo" value="' + esc(t.promo) + '" autocomplete="off"><button type="button" class="btn-ghost btn-sm" id="promo-ok">' + (t.promo ? 'Retirer' : 'Appliquer') + '</button></div><div class="s-promo-msg" id="promo-msg"></div>' +
      '<div class="row"><span>Sous-total</span><b>' + money(t.subtotal) + '</b></div>' +
      (t.discount ? '<div class="row disc"><span>Code ' + esc(t.promo) + '</span><b>−' + money(t.discount) + '</b></div>' : '') +
      '<div class="row"><span>Livraison</span><b>' + shipTxt + '</b></div>' +
      '<div class="row total"><span>Total</span><b>' + money(t.total) + '</b></div>' +
      (t.freeShip ? '' : '<div class="s-muted" style="margin-top:6px">Plus que ' + money(t.remainingForFree) + ' pour la livraison standard offerte.</div>') +
      '<div style="text-align:center;margin-top:14px"><a class="link-plain" href="panier.html">Modifier mon panier</a></div>';
    // prix des modes de livraison
    Object.keys(CFG.shipping).forEach(function (k) {
      var el = document.querySelector('[data-shipprice="' + k + '"]'); if (!el) return;
      var pr = V.computeTotals(lines, k).shipping;
      el.textContent = pr === 0 ? 'Offerte' : money(pr);
    });
    var btn = $('submit');
    if (btn) btn.textContent = (state.payment === 'cod' ? 'Confirmer la commande · ' : 'Payer ') + money(t.total);
  }

  /* ---------- adresses enregistrées ---------- */
  function fillAddress(a) {
    ['firstName', 'lastName', 'phone', 'address', 'complement', 'zip', 'city'].forEach(function (k) { if ($(k)) $(k).value = (a && a[k]) || ''; });
  }
  function initSaved() {
    var user = V.currentUser(); if (!user) return;
    $('firstName').value = user.firstName; $('lastName').value = user.lastName; $('email').value = user.email; $('email').readOnly = true; $('phone').value = user.phone || '';
    var list = user.addresses || [];
    if (!list.length) return;
    var def = list.filter(function (a) { return a.isDefault; })[0] || list[0];
    $('saved').innerHTML = '<div class="s-opts" style="margin-bottom:16px">' + list.map(function (a) {
      return '<label class="s-opt' + (a.id === def.id ? ' sel' : '') + '" data-saved="' + a.id + '"><input type="radio" name="saved" value="' + a.id + '"' + (a.id === def.id ? ' checked' : '') + '><div class="body"><div class="t">' + esc(a.label || 'Adresse') + (a.isDefault ? ' · par défaut' : '') + '</div><div class="d">' + esc(a.firstName + ' ' + a.lastName) + '<br>' + V.lineAddress(a) + '</div></div></label>';
    }).join('') + '<label class="s-opt" data-saved="new"><input type="radio" name="saved" value="new"><div class="body"><div class="t">Utiliser une autre adresse</div></div></label></div>';
    state.savedAddr = def.id; fillAddress(def); $('addr-form').style.display = 'none';
    if ($('saveAddr')) $('saveAddr').closest('label').style.display = 'none';
    $('saved').addEventListener('change', function (e) {
      var id = e.target.value; state.savedAddr = id;
      $('saved').querySelectorAll('.s-opt').forEach(function (o) { o.classList.toggle('sel', o.getAttribute('data-saved') === id); });
      if (id === 'new') { fillAddress(null); $('phone').value = user.phone || ''; $('addr-form').style.display = ''; $('saveAddr').closest('label').style.display = ''; }
      else { fillAddress(list.filter(function (a) { return a.id === id; })[0]); $('addr-form').style.display = 'none'; $('saveAddr').closest('label').style.display = 'none'; }
    });
  }

  /* ---------- validation ---------- */
  function validate1() {
    var ok = true;
    ['firstName', 'lastName', 'address', 'city'].forEach(function (id) { ok = setInvalid(id, !val(id)) && ok; });
    ok = setInvalid('email', !V.isEmail(val('email'))) && ok;
    ok = setInvalid('phone', !V.isPhone(val('phone'))) && ok;
    ok = setInvalid('zip', !/^\d{5}$/.test(val('zip'))) && ok;
    var acc = $('mkAccount');
    if (acc && acc.checked) {
      var e = $('acc-err'); e.classList.remove('show');
      var badPw = val('pw').length < 8; ok = setInvalid('pw', badPw) && ok;
      ok = setInvalid('pw2', !badPw && val('pw') !== val('pw2')) && ok;
      if (V.userExists(val('email'))) { e.textContent = 'Un compte existe déjà avec cet e-mail. Connectez-vous pour continuer ou décochez la création de compte.'; e.classList.add('show'); ok = false; }
    }
    return ok;
  }
  function validateCard() {
    var ok = true, num = val('cardNum').replace(/\s/g, '');
    ok = setInvalid('cardName', !val('cardName')) && ok;
    ok = setInvalid('cardNum', !V.luhn(num)) && ok;
    var m = val('cardExp').match(/^(\d{2})\/(\d{2})$/), expOk = false;
    if (m) { var mm = +m[1], yy = 2000 + (+m[2]), now = new Date(); expOk = mm >= 1 && mm <= 12 && (yy > now.getFullYear() || (yy === now.getFullYear() && mm >= now.getMonth() + 1)); }
    ok = setInvalid('cardExp', !expOk) && ok;
    ok = setInvalid('cardCvc', !/^\d{3,4}$/.test(val('cardCvc'))) && ok;
    return ok;
  }

  function unlock(n) {
    state.step = n; steps();
    for (var i = 1; i <= 3; i++) $('sec' + i).classList.toggle('locked', i > n);
    var t = $('sec' + n); setTimeout(function () { t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 60);
  }

  /* ---------- soumission ---------- */
  function placeOrder(payment) {
    var lines = V.linesFromCart(), totals = V.computeTotals(V.cartLines(), state.delivery), ship = CFG.shipping[state.delivery];
    var contact = { firstName: val('firstName'), lastName: val('lastName'), email: val('email').toLowerCase(), phone: val('phone') };
    var address = { id: state.savedAddr && state.savedAddr !== 'new' ? state.savedAddr : null, label: 'Livraison', firstName: val('firstName'), lastName: val('lastName'), phone: val('phone'), address: val('address'), complement: val('complement'), zip: val('zip'), city: val('city') };
    var order = V.createOrder({ contact: contact, address: address, lines: lines, totals: totals, note: val('note'),
      delivery: { key: ship.key, label: ship.label, eta: ship.eta, price: totals.shipping }, payment: payment });
    var after = function () { V.clearCart(); location.href = 'confirmation.html?o=' + encodeURIComponent(order.id); };
    var user = V.currentUser();
    if (user && $('saveAddr') && $('saveAddr').checked) { address.label = 'Adresse ' + ((user.addresses || []).length + 1); address.id = null; V.saveAddress(address); }
    if (!user && $('mkAccount') && $('mkAccount').checked) {
      address.label = 'Domicile'; address.id = null;
      V.register({ firstName: contact.firstName, lastName: contact.lastName, email: contact.email, phone: contact.phone, password: val('pw'), addresses: [Object.assign({ id: V.newId('a'), isDefault: true }, address)] }).then(after);
    } else after();
  }
  function processing(title, text, ms, then) {
    var ov = V.modal({ title: title, html: '<div class="s-spin"></div><p style="text-align:center;margin:0">' + esc(text) + '</p>', dismissible: false });
    setTimeout(function () { ov.__close(); then(); }, ms);
  }
  function submit(e) {
    e.preventDefault();
    var err = $('pay-err'); err.classList.remove('show');
    if (!validate1()) { unlock(1); return; }
    if (!state.delivery) { unlock(2); $('ship-err').classList.add('show'); return; }
    $('cgv-w').classList.toggle('invalid', !$('cgv').checked);
    if (state.payment === 'card' && !validateCard()) return;
    if (!$('cgv').checked) { err.textContent = 'Veuillez accepter les conditions générales de vente pour continuer.'; err.classList.add('show'); return; }
    var btn = $('submit'); btn.disabled = true;
    if (state.payment === 'card') {
      var num = val('cardNum').replace(/\s/g, ''), last4 = num.slice(-4);
      processing('Paiement en cours…', 'Authentification de votre carte auprès de votre banque. Merci de patienter.', 1800, function () {
        if (/0002$/.test(num)) { btn.disabled = false; err.textContent = 'Paiement refusé par votre banque. Vérifiez vos informations ou essayez un autre moyen de paiement.'; err.classList.add('show'); $('cardNum').focus(); return; }
        placeOrder({ key: 'card', label: 'Carte bancaire •••• ' + last4, status: 'Payée' });
      });
    } else if (state.payment === 'wallet') {
      processing('Redirection vers PayPal…', 'Simulation : validation du paiement sur PayPal.', 2000, function () { placeOrder({ key: 'wallet', label: 'PayPal', status: 'Payée' }); });
    } else {
      placeOrder({ key: 'cod', label: state.delivery === 'pickup' ? 'Paiement en pharmacie' : 'Paiement à la livraison', status: 'À payer ' + (state.delivery === 'pickup' ? 'au retrait' : 'à la livraison') });
    }
  }

  /* ---------- initialisation ---------- */
  if (!build()) return;
  initSaved(); steps(); renderSummary();

  $('next1').addEventListener('click', function () { if (validate1()) unlock(2); else { var f = document.querySelector('#sec1 .invalid, #sec1 .s-alert.show'); if (f) f.scrollIntoView({ behavior: 'smooth', block: 'center' }); } });
  $('next2').addEventListener('click', function () { if (!state.delivery) { $('ship-err').classList.add('show'); return; } unlock(3); });
  var lo = $('lo'); if (lo) lo.addEventListener('click', function () { V.logout(); location.reload(); });
  if ($('mkAccount')) $('mkAccount').addEventListener('change', function () { $('acc-fields').style.display = this.checked ? '' : 'none'; });

  document.querySelectorAll('[data-ship]').forEach(function (o) {
    o.addEventListener('change', function () {
      state.delivery = o.getAttribute('data-ship');
      document.querySelectorAll('[data-ship]').forEach(function (x) { x.classList.toggle('sel', x === o); });
      $('ship-err').classList.remove('show');
      $('cod-t').textContent = state.delivery === 'pickup' ? 'Paiement en pharmacie' : 'Paiement à la livraison';
      $('cod-d').textContent = state.delivery === 'pickup' ? 'Réglez directement en pharmacie au moment du retrait.' : 'Réglez en espèces à la réception de votre colis.';
      renderSummary();
    });
  });
  document.querySelector('[data-pay="card"]').addEventListener('click', function (e) {
    var r = this.querySelector('input[type=radio]');
    if (!r.checked && !e.target.closest('.extra')) { r.checked = true; r.dispatchEvent(new Event('change', { bubbles: true })); }
  });
  document.querySelectorAll('[data-pay]').forEach(function (o) {
    o.addEventListener('change', function () {
      state.payment = o.getAttribute('data-pay');
      document.querySelectorAll('[data-pay]').forEach(function (x) { x.classList.toggle('sel', x === o); });
      renderSummary();
    });
  });

  // formatage des champs
  $('phone').addEventListener('blur', function () { if (V.isPhone(this.value)) this.value = V.fmtPhone(this.value); });
  $('cardNum').addEventListener('input', function () { var d = this.value.replace(/\D/g, '').slice(0, 19); this.value = d.replace(/(.{4})/g, '$1 ').trim(); });
  $('cardExp').addEventListener('input', function () { var d = this.value.replace(/\D/g, '').slice(0, 4); this.value = d.length > 2 ? d.slice(0, 2) + '/' + d.slice(2) : d; });
  $('cardCvc').addEventListener('input', function () { this.value = this.value.replace(/\D/g, '').slice(0, 4); });
  $('zip').addEventListener('input', function () { this.value = this.value.replace(/\D/g, '').slice(0, 5); });
  root.addEventListener('input', function (e) { var w = e.target.closest('.s-field'); if (w) w.classList.remove('invalid'); if (e.target.id === 'cgv') $('cgv-w').classList.remove('invalid'); });

  // code promo (dans le récapitulatif, re-rendu à chaque changement)
  $('summary').addEventListener('click', function (e) {
    if (e.target.id !== 'promo-ok') return;
    var r;
    if (V.getPromo()) { V.clearPromo(); r = { ok: true, msg: 'Code promo retiré.' }; } else r = V.applyPromo($('promo').value);
    var m = $('promo-msg'); if (m) { m.textContent = r.msg; m.className = 's-promo-msg ' + (r.ok ? 'ok' : 'err'); }
  });
  $('summary').addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.id === 'promo') { e.preventDefault(); $('promo-ok').click(); } });
  document.addEventListener('vital:cart', function () { if (!V.cartLines().length) { return; } renderSummary(); });
  $('checkout').addEventListener('submit', submit);
})();
</script>
</body>
</html>
